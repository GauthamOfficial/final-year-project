# /etc/nginx/sites-available/lankaguide
# Reverse-proxy front for the LankaGuide AI stack (PRD §13.4 + Prompt 7B).
#
# Layout:
#   /            → Next.js (Node) on 127.0.0.1:3000
#   /api/        → Django (Gunicorn) on /run/gunicorn.sock
#   /static/     → Django collectstatic output
#   /media/      → user uploads / curated multimedia mirror

# ── Rate-limit zones (PRD §14.1 mitigation) ────────────────────────────
limit_req_zone  $binary_remote_addr  zone=api_limit:10m  rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name lankaguide.lk www.lankaguide.lk;

    # certbot will rewrite this to a redirect once TLS is provisioned.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lankaguide.lk www.lankaguide.lk;

    ssl_certificate     /etc/letsencrypt/live/lankaguide.lk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lankaguide.lk/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 16M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Security headers
    add_header  X-Content-Type-Options nosniff   always;
    add_header  X-Frame-Options        SAMEORIGIN always;
    add_header  Referrer-Policy        strict-origin-when-cross-origin always;

    # ── Django API ─────────────────────────────────────────────────────
    location /api/ {
        limit_req           zone=api_limit burst=40 nodelay;
        proxy_pass          http://unix:/run/gunicorn.sock;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
    }

    location /admin/ {
        proxy_pass          http://unix:/run/gunicorn.sock;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    location /healthz/ {
        proxy_pass          http://unix:/run/gunicorn.sock;
        proxy_set_header    Host $host;
        access_log off;
    }

    # ── Django static / media ──────────────────────────────────────────
    location /static/ {
        alias /var/www/lankaguide/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /var/www/lankaguide/media/;
        expires 7d;
    }

    # ── Next.js SSR ────────────────────────────────────────────────────
    location / {
        proxy_pass          http://127.0.0.1:3000;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        'upgrade';
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  60s;
    }
}
